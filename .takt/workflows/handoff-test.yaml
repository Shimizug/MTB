name: codex-to-copilot-test
initial_step: codex
max_steps: 2

steps:
  - name: codex
    persona: codex-test
    edit: false
    rules:
      - condition: Codex completed
        next: copilot

  - name: copilot
    persona: copilot-test
    edit: false
    rules:
      - condition: Copilot completed
        next: COMPLETE
