services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
  frontend-init:
    image: node:24-alpine3.23
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: npm install --package-lock-only
volumes:
  frontend_node_modules:
