name: Review Handoff
on:
  pull_request_review:
    types: [submitted]
jobs:
  detect-copilot-review:
    if: github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Copilot review detected
        run: |
          echo "Copilot review completed."
          echo "PR: #${{ github.event.pull_request.number }}"
