name: Review Handoff

on:
  pull_request_review:
    types: [submitted]

jobs:
  detect-codex-review:
    if: contains(github.event.review.user.login, 'codex')
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Codex review detected
        run: |
          echo "Codex review completed."
          echo "Reviewer: ${{ github.event.review.user.login }}"
          echo "PR: #${{ github.event.pull_request.number }}"
